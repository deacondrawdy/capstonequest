# Railway's Nixpacks image ships npm 9, but this repo's package-lock.json was
# generated by npm 11. `npm ci` hard-fails across that gap — npm 9 resolves a
# different tree and reports entries as missing:
#
#   npm error Missing: lru-cache@11.5.2 from lock file
#
# `npm install` resolves against package.json instead, so it tolerates the
# drift. Less reproducible than `npm ci`, but `npm ci` cannot work here without
# pinning both npm versions to match.
#
# --include=dev is required separately: the build image sets npm's `production`
# config ("npm warn config production Use `--omit=dev` instead"), which would
# omit vite and nitro and break `npm run build` even after a successful install.
[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]
